# Keeps a fork up to date with the repository it was forked from.
#
# Three GitHub constraints shape this:
#
#   Workflows are disabled in a fork until its owner enables them once, from the
#   Actions tab. There is no way to opt in on their behalf.
#
#   The fork holds two local edits in wrangler.jsonc: the Worker's name and the
#   KV namespace id. This merges rather than force-syncing, so both survive.
#   Upstream changes elsewhere in wrangler.jsonc (a new binding, a migration,
#   observability) merge cleanly. If an upstream change lands next to one of
#   those two lines, the merge conflicts; the step below then takes upstream's
#   wrangler.jsonc and puts this fork's name and KV id back into it. A conflict
#   in any other file still stops here for a human.
#
#   This workflow's token cannot push changes to workflow files. When this file
#   itself changes upstream, the automatic sync fails until the fork's owner
#   clicks "Sync fork" then "Update branch" once on the fork's GitHub page.
#
# Upstream is discovered from the fork itself, so nothing here needs editing.

name: Sync with upstream

on:
  schedule:
    - cron: '0 8 * * *'   # daily, 08:00 UTC
  workflow_dispatch:       # or run it on demand from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    # Only forks have an upstream to sync from.
    if: github.event.repository.fork
    runs-on: ubuntu-latest

    steps:
      - name: Check out the fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find the upstream repository
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          parent=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.parent.full_name // empty')
          if [ -z "$parent" ]; then
            echo "No upstream found; nothing to sync."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream is $parent"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "repo=$parent" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream changes
        if: steps.upstream.outputs.found == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${{ steps.upstream.outputs.repo }}.git"
          git fetch upstream

          branch="${GITHUB_REF_NAME}"
          if ! git rev-parse --verify "upstream/${branch}" >/dev/null 2>&1; then
            echo "Upstream has no ${branch} branch; nothing to do."
            exit 0
          fi

          if git merge-base --is-ancestor "upstream/${branch}" HEAD; then
            echo "Already up to date."
            exit 0
          fi

          if ! git merge --no-edit "upstream/${branch}"; then
            # >>> resolve-wrangler
            # Only a conflict confined to wrangler.jsonc is resolved automatically:
            # upstream's file, with this fork's Worker name and KV namespace id put back.
            conflicted=$(git diff --name-only --diff-filter=U)
            if [ "$conflicted" != "wrangler.jsonc" ]; then
              echo "::error::Merge conflict beyond wrangler.jsonc ($conflicted). Resolve it manually."
              exit 1
            fi
            ours=$(git show HEAD:wrangler.jsonc)
            name=$(printf '%s\n' "$ours" | grep -m1 -oE '^  "name": "[^"]*"' | sed -E 's/.*"name": "([^"]*)"/\1/')
            kvid=$(printf '%s\n' "$ours" | grep -m1 -oE '"id": "[^"]*"' | sed -E 's/"id": "([^"]*)"/\1/')
            if [ -z "$name" ] || [ -z "$kvid" ]; then
              echo "::error::Could not read this fork's name or KV namespace id from wrangler.jsonc. Resolve it manually."
              exit 1
            fi
            git show "upstream/${branch}:wrangler.jsonc" > wrangler.jsonc
            sed -i -E "0,/^  \"name\": \"[^\"]*\"/s//  \"name\": \"${name}\"/" wrangler.jsonc
            sed -i -E "0,/\"id\": \"[^\"]*\"/s//\"id\": \"${kvid}\"/" wrangler.jsonc
            if ! grep -q "^  \"name\": \"${name}\"" wrangler.jsonc || ! grep -q "\"id\": \"${kvid}\"" wrangler.jsonc; then
              echo "::error::Could not put this fork's name and KV namespace id back. Resolve it manually."
              exit 1
            fi
            git add wrangler.jsonc
            git commit --no-edit
            echo "Resolved wrangler.jsonc: upstream's version, keeping this fork's name (${name}) and KV namespace id."
            # <<< resolve-wrangler
          fi

          git push origin "${branch}"
